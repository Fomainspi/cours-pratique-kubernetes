# Optional: requires an Ingress Controller and DNS/TLS configuration.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: foma-shop-ingress
  namespace: foma-shop
spec:
  ingressClassName: nginx
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: foma-frontend-service
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: foma-backend-service
                port:
                  number: 80
