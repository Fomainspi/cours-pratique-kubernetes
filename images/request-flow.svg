<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360"><rect width="1100" height="360" fill="#f8fafc"/><text x="550" y="45" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="#172033">Chemin d'une requête applicative</text><g font-family="Arial" text-anchor="middle"><rect x="35" y="125" width="180" height="105" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="125" y="165" font-size="21" fill="#075985">Utilisateur</text><text x="125" y="195" font-size="15" fill="#075985">Navigateur</text><rect x="260" y="125" width="190" height="105" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="355" y="165" font-size="21" fill="#1e40af">Frontend</text><text x="355" y="195" font-size="15" fill="#1e40af">Service / Ingress</text><rect x="500" y="125" width="190" height="105" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="595" y="165" font-size="21" fill="#166534">Backend API</text><text x="595" y="195" font-size="15" fill="#166534">foma-backend-service</text><rect x="740" y="125" width="190" height="105" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="835" y="165" font-size="21" fill="#92400e">PostgreSQL</text><text x="835" y="195" font-size="15" fill="#92400e">postgres-service:5432</text></g><g stroke="#334155" stroke-width="4" fill="none"><path d="M215 178 H260 M450 178 H500 M690 178 H740"/><path d="M248 167 L260 178 L248 189 M488 167 L500 178 L488 189 M728 167 L740 178 L728 189"/></g><text x="550" y="285" text-anchor="middle" font-family="Arial" font-size="17" fill="#475569">CoreDNS résout les noms ; Service + EndpointSlices + dataplane orientent le trafic vers les Pods.</text><text x="550" y="320" text-anchor="middle" font-family="Arial" font-size="15" fill="#64748b">Le navigateur ne résout pas directement les noms DNS internes du cluster.</text></svg>